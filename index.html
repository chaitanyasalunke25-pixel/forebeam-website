<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forebeam</title>
  <meta name="description" content="Forebeam — Apps, technology, information and digital products.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }

    header {
      padding: 24px 7%;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 100px 7%;
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      margin: 0 0 20px;
      letter-spacing: -2px;
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto 45px;
      color: #cbd5e1;
      font-size: 19px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card h2 {
      margin-top: 0;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    a {
      color: #93c5fd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Forebeam</div>
  </header>

  <main>
    <h1>Forebeam</h1>

    <p class="subtitle">
      Building useful digital products, applications and information
      resources.
    </p>

    <div class="card">
      <h2>CAT Preparation Tracker</h2>
      <p>
        A study and preparation tracking application designed to help
        students organize their preparation and monitor their progress.
      </p>
    </div>
  </main>

  <footer>
    © 2026 Forebeam ·
    <a href="privacy-policy.html">Privacy Policy</a>
  </footer>

</body>
</html>
